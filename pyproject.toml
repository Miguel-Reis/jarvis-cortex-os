[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-cortex-os"
version = "1.0.0"
description = "Autonomous Zero-Ollama Cognitive & Workflow Brain: HippoRAG 2 PPR, Next-Action Planner, Adaptive Personality, Vault Provenance, and Skywalker Sound Mark-VII Voice DSP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Miguel Reis", email = "miguel.reis@example.com" }
]
keywords = [
    "jarvis",
    "cognitive-architecture",
    "hipporag",
    "personalized-pagerank",
    "workflow-automation",
    "lsh",
    "zero-dependency",
    "autonomous-agent",
    "dsp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
jarvis = "jarvis_os.cli:main"

[project.urls]
Homepage = "https://github.com/Miguel-Reis/jarvis-cortex-os"
Repository = "https://github.com/Miguel-Reis/jarvis-cortex-os"
